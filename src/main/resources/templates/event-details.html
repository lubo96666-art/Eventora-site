<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.title} + ' | Eventora'">Събитие | Eventora</title>
    <style>
        *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6fb;color:#151923}.top{background:#071020;color:#fff;padding:18px 24px}.nav{max-width:1120px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:950}.brand span{color:#00d084}.top a{color:#fff;text-decoration:none;font-weight:900}.hero{min-height:350px;background:linear-gradient(90deg,rgba(7,16,32,.97),rgba(7,16,32,.62)),url('/images/eventora-hero.png') center/cover;color:#fff;display:flex;align-items:end}.hero-inner{width:100%;max-width:1120px;margin:auto;padding:62px 24px}.category{display:inline-block;background:#00d084;color:#06120c;border-radius:999px;padding:8px 12px;font-weight:950}.hero h1{font-size:clamp(38px,6vw,68px);max-width:820px;line-height:1;margin:18px 0 12px;letter-spacing:-2px}.hero p{font-size:18px;opacity:.9}.wrap{max-width:1120px;margin:28px auto;padding:0 24px;display:grid;grid-template-columns:1.25fr .75fr;gap:22px}.panel{background:#fff;border:1px solid #e4e9f2;border-radius:24px;padding:26px;box-shadow:0 12px 35px rgba(13,23,48,.08)}.panel h2{margin-top:0}.description{font-size:17px;line-height:1.65;color:#4b5568}.facts{display:grid;gap:14px}.fact{padding:14px;border-radius:16px;background:#f6f8fc}.fact span{display:block;color:#687285;font-size:13px;font-weight:800}.fact b{display:block;margin-top:5px;font-size:18px}.price{font-size:36px;color:#087645}.btn{display:block;text-align:center;margin-top:18px;padding:14px 18px;border-radius:14px;background:#00d084;color:#06120c;text-decoration:none;font-weight:950}@media(max-width:760px){.wrap{grid-template-columns:1fr}.hero{min-height:300px}.hero h1{letter-spacing:-1px}}
    </style>
</head>
<body>
<header class="top"><div class="nav"><div class="brand">Eventora<span>.</span></div><a href="/visualization">← Всички събития</a></div></header>
<section class="hero"><div class="hero-inner"><span class="category" th:text="${event.category}">Категория</span><h1 th:text="${event.title}">Събитие</h1><p th:text="${event.location} + ' · ' + ${#temporals.format(event.startsAt,'dd.MM.yyyy, HH:mm')}">Място и дата</p></div></section>
<main class="wrap">
    <article class="panel"><h2>За събитието</h2><p class="description" th:text="${event.description}">Описание</p><h2>Място</h2><p class="description" th:text="${event.venue.name} + ', ' + ${event.venue.city} + ' — ' + ${event.venue.address}">Адрес</p></article>
    <aside class="panel"><div class="facts"><div class="fact"><span>Дата и час</span><b th:text="${#temporals.format(event.startsAt,'dd MMMM yyyy, HH:mm')}">Дата</b></div><div class="fact"><span>Свободни места</span><b th:text="${event.availableSeats} + ' от ' + ${event.venue.capacity}">0</b></div><div class="fact"><span>Цена на билет</span><b class="price" th:text="'€' + ${#numbers.formatDecimal(event.price,1,2)}">€0.00</b></div></div><a class="btn" href="/visualization#events">Избери билети</a></aside>
</main>
<section class="panel" style="max-width:1072px;margin:0 auto 40px">
    <h2>Оценки от посетители</h2>
    <p th:if="${param.review}" style="color:#087645;font-weight:800">Операцията с оценката е успешна.</p>
    <form th:if="${currentUserId != null}" th:action="@{'/events/' + ${event.id} + '/reviews'}" method="post">
        <label>Оценка <select name="rating"><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></label>
        <label>Коментар <textarea name="comment" minlength="5" maxlength="500" required></textarea></label>
        <button class="btn" type="submit">Публикувай оценка</button>
    </form>
    <p th:if="${currentUserId == null}"><a href="/login">Влез в профила си</a>, за да оставиш оценка.</p>
    <article class="fact" th:each="review : ${reviews}" style="margin-top:14px">
        <b th:text="${review.authorName + ' · ' + review.rating + '/5'}"></b><p th:text="${review.comment}"></p>
        <div th:if="${currentUserId != null and currentUserId.equals(review.authorId)}">
            <form th:action="@{'/events/' + ${event.id} + '/reviews/' + ${review.id} + '/edit'}" method="post"><select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><input name="comment" th:value="${review.comment}" minlength="5" maxlength="500" required><button>Редактирай</button></form>
            <form th:action="@{'/events/' + ${event.id} + '/reviews/' + ${review.id} + '/delete'}" method="post"><button>Изтрий</button></form>
        </div>
    </article>
</section>
</body>
</html>
